name: Release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      os:
        description: "Target OS"
        required: true
        type: choice
        options: [android, linux, windows]
        default: android

      game_url:
        description: "Game data URL"
        required: true
        type: string

      update_url:
        description: "Update data URL"
        required: false
        type: string

      dlc_url:
        description: "DLC data URL"
        required: false
        type: string

      embed_game_files:
        description: "Embed game files in APK"
        required: false
        type: boolean
        default: true


jobs:
  prepare-assets:
    name: Prepare Assets
    runs-on: ubuntu-24.04

    env:
      ASSET_REPO: ${{ secrets.ASSET_REPO }}
      ASSET_REPO_TOKEN: ${{ secrets.ASSET_REPO_TOKEN }}

    outputs:
      has_assets: ${{ steps.check.outputs.has_assets }}
      has_game_data: ${{ steps.package.outputs.has_game_data }}

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget p7zip-full cmake build-essential libcurl4-openssl-dev zstd

      - name: Create workspace
        run: mkdir -p ./UnleashedRecompLib/private

      # =========================
      # SAFE DOWNLOAD CORE
      # =========================
      - name: Download Data (HARDENED)
        if: ${{ github.event_name == 'workflow_dispatch' || env.ASSET_REPO != '' }}
        env:
          GAME_URL: ${{ github.event.inputs.game_url }}
          UPDATE_URL: ${{ github.event.inputs.update_url }}
          DLC_URL: ${{ github.event.inputs.dlc_url }}
        run: |
          set -euo pipefail

          BASE="./UnleashedRecompLib/private"

          safe_name() {
            echo "$1" | tr -d '\r\n' \
              | sed 's/[?&=<>:"|*]/_/g' \
              | sed 's/[^a-zA-Z0-9._-]/_/g'
          }

          download_one() {
            local url="$1"
            if [ -z "$url" ]; then return 0; fi

            echo "::add-mask::$url"

            tmp="dl_$(date +%s%N).bin"

            wget --no-check-certificate \
              --content-disposition \
              --tries=10 \
              --timeout=60 \
              -O "$BASE/$tmp" \
              "$url"

            clean=$(safe_name "$tmp")
            mv "$BASE/$tmp" "$BASE/$clean"
          }

          download_one "$GAME_URL"
          download_one "$UPDATE_URL"
          download_one "$DLC_URL"

      # =========================
      # SANITIZATION LAYER (CRITICAL)
      # =========================
      - name: Sanitize filesystem (CRASH PROOF)
        run: |
          set -euo pipefail

          BASE="./UnleashedRecompLib/private"

          find "$BASE" -depth | while read -r path; do
            dir=$(dirname "$path")
            base=$(basename "$path")

            clean=$(echo "$base" \
              | tr -d '\r\n' \
              | sed 's/[?&=<>:"|*]/_/g' \
              | sed 's/[^a-zA-Z0-9._-]/_/g')

            if [ "$base" != "$clean" ]; then
              echo "Renaming: $base -> $clean"
              mv -n "$path" "$dir/$clean" || true
            fi
          done

      # =========================
      # CHECK
      # =========================
      - name: Check Assets
        id: check
        run: |
          if [ -f "./UnleashedRecompLib/private/default.xex" ]; then
            echo "has_assets=true" >> $GITHUB_OUTPUT
          else
            echo "has_assets=false" >> $GITHUB_OUTPUT
            echo "Missing default.xex"
            exit 1
          fi

      # =========================
      # UPLOAD SAFE ARTIFACT
      # =========================
      - name: Upload Prepared Assets
        if: steps.check.outputs.has_assets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prepared-assets
          path: ./UnleashedRecompLib/private/
          retention-days: 1

      # =========================
      # PACKAGE (unchanged logic but safe)
      # =========================
      - name: Package Game Data
        id: package
        if: steps.check.outputs.has_assets == 'true'
        run: |
          set -euo pipefail

          BASE="./UnleashedRecompLib/private"
          STAGING="./game_data"

          mkdir -p "$STAGING/game"
          mkdir -p "$STAGING/update"

          if [ -f "$BASE/default.xexp" ]; then
            cp "$BASE/default.xexp" "$STAGING/update/default.xexp"
          fi

          find "$BASE" -maxdepth 1 -type f | while read -r f; do
            cp "$f" "$STAGING/game/" || true
          done

          tar cf - -C "$STAGING" . | zstd -T0 -19 -o game_data.tar.zst

          echo "has_game_data=true" >> $GITHUB_OUTPUT

          rm -rf "$STAGING"

      - name: Upload Game Archive
        if: steps.package.outputs.has_game_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: game-data
          path: game_data.tar.zst
          retention-days: 7


  build:
    name: Build (${{ inputs.os || 'android' }})
    needs: prepare-assets
    if: needs.prepare-assets.outputs.has_assets == 'true'

    runs-on: ubuntu-24.04
    env:
      OS: ${{ inputs.os || 'android' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          name: prepared-assets
          path: ./UnleashedRecompLib/private/

      - name: Final sanitize safety pass
        run: |
          find ./UnleashedRecompLib/private -type f | while read f; do
            safe=$(echo "$f" | sed 's/[?&=<>:"|*]/_/g')
            if [ "$f" != "$safe" ]; then
              mv "$f" "$safe" || true
            fi
          done

      - name: Build APK (Android)
        if: env.OS == 'android'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        if: env.OS == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
